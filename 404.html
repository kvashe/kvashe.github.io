<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена | Треклисты Квашеной</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#6366f1">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.6);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0b1020;
            color: var(--text-main);
            background-image: 
                radial-gradient(at 80% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 20% 80%, rgba(244, 63, 94, 0.1) 0px, transparent 50%);
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            filter: blur(80px) brightness(0.15) saturate(2);
            opacity: 0.6;
            z-index: -1;
            animation: slowPulse 8s ease-in-out infinite;
        }
        @keyframes slowPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.7; }
        }
        .error-code {
            font-size: 120px;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 16px;
        }
        .error-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }
        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.4);
        }
        .parallax-notes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .note {
            position: absolute;
            user-select: none;
            pointer-events: none;
            will-change: top;
            font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
            text-shadow: 0 0 12px rgba(0,0,0,0.4);
            transition: top 0.1s linear;
        }
        .note-content {
            display: inline-block;
            animation: gentleFloat 6s infinite ease-in-out;
            will-change: transform;
        }
        @keyframes gentleFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }
        .container * { position: relative; z-index: 1; }
        @media (max-width: 480px) {
            .container { padding: 32px 24px; border-radius: 24px; }
            .error-code { font-size: 80px; }
            .error-title { font-size: 22px; }
            .error-desc { font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="parallax-notes" id="parallaxNotes"></div>
<div class="container">
    <div class="error-code">404</div>
    <div class="error-title">Страница не найдена</div>
    <div class="error-desc">
        Кажется, вы попали на несуществующую страницу.<br>
        Возможно, она была удалена или вы ошиблись в адресе.
    </div>
    <a href="/" class="btn">На главную</a>
</div>
<script>
(function() {
    var notesContainer = document.getElementById('parallaxNotes');
    if (!notesContainer) return;
    var noteSymbols = ['♩', '♫', '♩', '🎵', '🎶', '𝄞', '♬', '🎙️', '🎸', '🎹'];
    var notesCount = 10;
    var notes = [];
    for (var i = 0; i < notesCount; i++) {
        var noteDiv = document.createElement('div');
        noteDiv.className = 'note';
        var symbol = noteSymbols[Math.floor(Math.random() * noteSymbols.length)];
        var size = Math.floor(Math.random() * 130) + 50;
        var left = Math.random() * 100;
        var top = Math.random() * 100;
        var opacity = Math.random() * 0.4 + 0.2;
        var rotation = Math.random() * 360;
        var parallaxFactor = 0.2 + Math.random() * 0.6;
        var contentSpan = document.createElement('span');
        contentSpan.className = 'note-content';
        contentSpan.textContent = symbol;
        contentSpan.style.fontSize = size + 'px';
        contentSpan.style.opacity = opacity;
        contentSpan.style.color = 'rgba(255, 255, 255, ' + (opacity * 0.9) + ')';
        var animDuration = 4 + Math.random() * 6;
        contentSpan.style.animation = 'gentleFloat ' + animDuration + 's infinite ease-in-out';
        contentSpan.style.animationDelay = (Math.random() * 3) + 's';
        noteDiv.appendChild(contentSpan);
        noteDiv.style.left = left + '%';
        noteDiv.style.top = top + '%';
        noteDiv.style.transform = 'rotate(' + rotation + 'deg)';
        notesContainer.appendChild(noteDiv);
        notes.push({ element: noteDiv, baseTop: parseFloat(top), parallaxFactor: parallaxFactor });
    }
    var ticking = false;
    function updateNotesPosition() {
        var scrollY = window.scrollY;
        var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        var scrollProgress = maxScroll > 0 ? scrollY / maxScroll : 0;
        for (var i = 0; i < notes.length; i++) {
            var n = notes[i];
            var shiftPercent = (scrollProgress - 0.5) * n.parallaxFactor * 16;
            var newTop = n.baseTop + shiftPercent;
            newTop = Math.min(Math.max(newTop, -5), 105);
            n.element.style.top = newTop + '%';
        }
        ticking = false;
    }
    window.addEventListener('scroll', function() {
        if (!ticking) {
            requestAnimationFrame(updateNotesPosition);
            ticking = true;
        }
    }, { passive: true });
    window.addEventListener('resize', function() {
        updateNotesPosition();
    }, { passive: true });
    updateNotesPosition();
})();
</script>
</body>
</html>
